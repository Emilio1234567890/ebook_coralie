services:
  db:
    image: mysql:8.0
    container_name: ebook-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ebook
      MYSQL_USER: ebook
      MYSQL_PASSWORD: monebook225
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ebook_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: ./ebook-backend-node
      dockerfile: Dockerfile
    container_name: ebook-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./ebook-backend-node/.env
    ports:
      - "127.0.0.1:8001:8000"

  frontend:
    build:
      context: ./ebook-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: ebook-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./ebook-frontend/.env.local
    environment:
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  ebook_mysql_data:
